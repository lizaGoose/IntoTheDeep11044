import java.text.SimpleDateFormat

//
// build.gradle in FtcRobotController
//


apply plugin: 'com.android.library'
apply plugin: 'com.chaquo.python'

android {

    defaultConfig {
        minSdkVersion 24
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 28
        buildConfigField "String", "APP_BUILD_TIME", '"' + (new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())) + '"'

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        /*  python{
              pip{
                  install "ikpy"
                  install "ipywidgets"
              }
          }*/



    }
    chaquopy {
        defaultConfig {
            version = "3.8"
            buildPython("C:/Users/robot30/AppData/Local/Programs/Python/Python38/python.exe")
            pip{
                install "ikpy"
                options "--extra-index-url", "https://chaquo.com/pypi-extra/"
               // install "matplotlib"
                install "numpy==1.21.4"
                //install "urdfpy"
                install "libpython"
                install "Cython"

                pyc {
                    src = false
                }
            }
        }
        sourceSets {
            getByName("main") {
                srcDir("C:/Users/robot30/Documents/IntoTheDeep11044/TeamCode/src/main/java/org/firstinspires/ftc/teamcode/python")
            }
        }
    }

    compileSdkVersion 29

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace = 'com.qualcomm.ftcrobotcontroller'
}

apply from: '../build.dependencies.gradle'